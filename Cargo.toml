[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor", "worktrees"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tiny-artifacts"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs"] }
tracing = "0.1"
tinytools = { git = "https://github.com/tinyhumansai/tinytools.git", rev = "1ec3468f6602b69b955a0e94105ed63abb5aa98c", version = "0.6" }
# Blob-backed file versions use the same scoped port every OpenHuman module uses.
tinystoragedrivers-core = { version = "1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers.git", rev = "be94f7568fe7650b0729be55128f48270414b9a7" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
